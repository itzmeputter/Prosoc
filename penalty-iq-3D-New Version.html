<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penalty IQ — 3D Technique Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --chalk:#F4F1E8; --chalk-dim:#B9C4BB; --floodlight:#F5C242;
    --rust:#E15A3E; --panel:rgba(10,30,21,0.85); --border:rgba(244,241,232,0.14); --accent:#3ECF8E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:#0A1E15;color:var(--chalk);font-family:'Inter',sans-serif;overflow-x:hidden;}
  .app{display:grid;grid-template-columns:1fr 340px;height:100vh;}
  @media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:1fr auto;}}
  #viewport{position:relative;background:#0d2b1d;overflow:hidden;}
  #viewport canvas{display:block;width:100%;height:100%;}
  .hud{position:absolute;top:0;left:0;right:0;padding:14px 18px;pointer-events:none;z-index:10;}
  .hud .title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.03em;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  .hud .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--floodlight);letter-spacing:.12em;text-transform:uppercase;margin-top:2px;}
  .result-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);font-family:'Bebas Neue',sans-serif;font-size:clamp(42px,8vw,72px);letter-spacing:.04em;opacity:0;transition:opacity .3s,transform .3s;text-shadow:0 4px 20px rgba(0,0,0,.7);pointer-events:none;z-index:15;}
  .result-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .result-banner.goal{color:var(--floodlight);} .result-banner.saved{color:var(--rust);}
  .tech-bar{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(6,18,12,.94));padding:48px 20px 20px;pointer-events:none;z-index:12;opacity:0;transition:opacity .4s;}
  .tech-bar.active{opacity:1;}
  .tech-phase{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--floodlight);letter-spacing:.03em;}
  .tech-desc{font-size:13.5px;color:var(--chalk);max-width:560px;line-height:1.5;margin-top:6px;}
  .sidebar{background:var(--panel);border-left:1px solid var(--border);padding:18px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
  .section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--floodlight);margin-bottom:6px;}
  .gk-select{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);color:var(--chalk);font-size:13px;padding:9px 10px;border-radius:8px;cursor:pointer;}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--chalk-dim);cursor:pointer;transition:.15s;}
  .chip:hover{border-color:var(--chalk-dim);color:var(--chalk);}
  .chip.active{background:var(--floodlight);border-color:var(--floodlight);color:#241a02;font-weight:600;}
  .field label{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--chalk-dim);margin-bottom:5px;}
  .field label span.val{color:var(--floodlight);}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--floodlight) 0%,var(--floodlight) var(--fill,50%),rgba(244,241,232,.15) var(--fill,50%));outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--chalk);border:3px solid var(--floodlight);cursor:pointer;}
  .zone-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
  .zone-btn{aspect-ratio:1.5;border:1px solid var(--border);border-radius:6px;background:rgba(0,0,0,.25);color:var(--chalk-dim);font-family:'IBM Plex Mono',monospace;font-size:10px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;}
  .zone-btn:hover{border-color:rgba(244,241,232,.4);}
  .zone-btn.selected{border-color:var(--floodlight);background:rgba(245,194,66,.15);color:var(--floodlight);}
  .zone-btn.weak{border-color:rgba(62,207,142,.6);color:var(--accent);}
  .prob-box{background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .prob-box .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
  .prob-box .k{font-size:11px;color:var(--chalk-dim);font-family:'IBM Plex Mono',monospace;}
  .prob-box .v{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--floodlight);}
  .shoot-btn{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em;background:var(--floodlight);color:#241a02;border:none;border-radius:10px;padding:13px;cursor:pointer;transition:filter .12s,transform .1s;width:100%;}
  .shoot-btn:hover{filter:brightness(1.08);} .shoot-btn:active{transform:scale(.98);} .shoot-btn:disabled{opacity:.45;cursor:not-allowed;}
  .stats-row{display:flex;gap:8px;}
  .stat{flex:1;text-align:center;background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:8px;padding:7px 3px;}
  .stat .n{font-family:'Bebas Neue',sans-serif;font-size:20px;}
  .stat .l{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.05em;}
  .gk-card{background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12.5px;line-height:1.45;color:var(--chalk-dim);}
  .gk-card strong{color:var(--chalk);font-weight:600;}
  .weak-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:8px;}
  .weak-mini div{height:22px;border-radius:4px;font-size:9px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;}
  .weak-mini .w{background:rgba(62,207,142,.25);color:var(--accent);}
  .weak-mini .n{background:rgba(244,241,232,.06);color:var(--chalk-dim);}
  .weak-mini .s{background:rgba(225,90,62,.22);color:var(--rust);}
</style>
</head>
<body>
<div class="app">
  <div id="viewport">
    <div class="hud">
      <div>
        <div class="title">PENALTY IQ</div>
        <div class="sub">3D Technique Lab · PL 2025-26</div>
      </div>
    </div>
    <div class="result-banner" id="banner"></div>
    <div class="tech-bar" id="techBar">
      <div class="tech-phase" id="techPhase">PLANT FOOT</div>
      <div class="tech-desc" id="techDesc"></div>
    </div>
  </div>
  <aside class="sidebar">
    <div>
      <div class="section-label">Premier League Goalkeeper</div>
      <select class="gk-select" id="gkSelect"></select>
      <div class="gk-card" id="gkCard" style="margin-top:10px;"></div>
    </div>
    <div>
      <div class="section-label">Target Zone</div>
      <div class="zone-picker" id="zonePicker"></div>
    </div>
    <div class="field">
      <label>Power <span class="val" id="powerVal">72</span></label>
      <input type="range" id="power" min="25" max="100" value="72">
    </div>
    <div class="field">
      <label>Curve <span class="val" id="curveVal">0</span></label>
      <input type="range" id="curve" min="-45" max="45" value="0">
    </div>
    <div>
      <div class="section-label">Conditions</div>
      <div class="chip-row" id="weatherRow">
        <button class="chip active" data-w="clear">Clear</button>
        <button class="chip" data-w="wind">Windy</button>
        <button class="chip" data-w="rain">Rain</button>
      </div>
    </div>
    <div class="prob-box">
      <div class="row"><span class="k">Base zone rate</span><span class="v" id="baseRate">29%</span></div>
      <div class="row"><span class="k">vs this keeper</span><span class="v" id="predChance">—%</span></div>
    </div>
    <button class="shoot-btn" id="shootBtn">TAKE THE KICK · SLOW-MO</button>
    <div class="stats-row">
      <div class="stat"><div class="n" id="sAtt">0</div><div class="l">Shots</div></div>
      <div class="stat"><div class="n" id="sGoal">0</div><div class="l">Goals</div></div>
      <div class="stat"><div class="n" id="sSave">0</div><div class="l">Saved</div></div>
      <div class="stat"><div class="n" id="sRate">—</div><div class="l">Rate</div></div>
    </div>
  </aside>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const gks = [
  {id:'kelleher',name:'Caoimhín Kelleher',team:'Brentford',saves:3,faced:8,savePct:37.5,note:'Most PL saves this season. Strong low-right; weaker high-left.',weak:[0.85,0.55,0.40,0.70,0.45,0.50,0.75,0.60,0.35]},
  {id:'martinez',name:'Emiliano Martínez',team:'Aston Villa',saves:1,faced:1,savePct:100,note:'Elite timing & gamesmanship.',weak:[0.50,0.35,0.65,0.55,0.40,0.70,0.45,0.50,0.60]},
  {id:'donnarumma',name:'Gianluigi Donnarumma',team:'Man City',saves:1,faced:1,savePct:100,note:'Huge frame. Extreme low corners classic vulnerability.',weak:[0.70,0.40,0.75,0.55,0.30,0.55,0.80,0.45,0.85]},
  {id:'pickford',name:'Jordan Pickford',team:'Everton',saves:1,faced:4,savePct:25,note:'Aggressive early dives. Late direction change works.',weak:[0.60,0.70,0.55,0.50,0.65,0.45,0.55,0.75,0.50]},
  {id:'henderson',name:'Dean Henderson',team:'Crystal Palace',saves:1,faced:6,savePct:16.7,note:'Solid. Low-left historically productive.',weak:[0.75,0.50,0.45,0.65,0.40,0.55,0.80,0.55,0.50]},
  {id:'verbruggen',name:'Bart Verbruggen',team:'Brighton',saves:1,faced:6,savePct:16.7,note:'Athletic. Extreme high corners hardest.',weak:[0.65,0.55,0.70,0.50,0.35,0.50,0.60,0.45,0.75]},
  {id:'roefs',name:'Robin Roefs',team:'Sunderland',saves:1,faced:3,savePct:33.3,note:'Proactive. Low far-post softer.',weak:[0.55,0.45,0.70,0.60,0.40,0.65,0.50,0.55,0.75]},
  {id:'sels',name:'Matz Sels',team:'Nott\'m Forest',saves:1,faced:5,savePct:20,note:'Mid-height either side more productive.',weak:[0.50,0.65,0.55,0.70,0.45,0.70,0.55,0.60,0.50]},
  {id:'mamardashvili',name:'Giorgi Mamardashvili',team:'Liverpool',saves:1,faced:2,savePct:50,note:'Limited sample. Low corners classic.',weak:[0.70,0.45,0.75,0.55,0.35,0.55,0.80,0.50,0.80]}
];
const zones = [{p:7,l:'High L'},{p:4,l:'High C'},{p:5,l:'High R'},{p:7,l:'Mid L'},{p:6,l:'Mid C'},{p:9,l:'Mid R'},{p:29,l:'Low L'},{p:10,l:'Low C'},{p:23,l:'Low R'}];
let state = {selected:6,power:72,curve:0,weather:'clear',gk:gks[0]};
let stats = {att:0,goal:0,save:0};
let animating = false;

// ========== THREE.JS ==========
const viewport = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d2b1d);
scene.fog = new THREE.Fog(0x0d2b1d, 28, 60);

const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
camera.position.set(0, 3.4, 15);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
viewport.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI*0.47; controls.minDistance = 2.5; controls.maxDistance = 24;
controls.target.set(0, 1.3, 2.5);

// Lights
scene.add(new THREE.HemisphereLight(0xc8e0d0, 0x1a3a28, 0.5));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.4);
sun.position.set(9, 20, 11); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1; sun.shadow.camera.far=45;
sun.shadow.camera.left=-20; sun.shadow.camera.right=20;
sun.shadow.camera.top=20; sun.shadow.camera.bottom=-8;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aacc, 0.3).translateX(-7).translateY(5).translateZ(-5));

// Pitch
const pitch = new THREE.Mesh(new THREE.PlaneGeometry(44, 55), new THREE.MeshStandardMaterial({color:0x1a5c38, roughness:0.9}));
pitch.rotation.x = -Math.PI/2; pitch.receiveShadow = true; scene.add(pitch);

function mkLine(x1,z1,x2,z2,w=0.07){
  const len = Math.hypot(x2-x1,z2-z1);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(len,w), new THREE.MeshBasicMaterial({color:0xf4f1e8}));
  m.rotation.x=-Math.PI/2; m.position.set((x1+x2)/2,0.012,(z1+z2)/2); m.rotation.z=Math.atan2(z2-z1,x2-x1); scene.add(m);
}
mkLine(-8.2,0,8.2,0,0.09); mkLine(-8.2,0,-8.2,16.5); mkLine(8.2,0,8.2,16.5); mkLine(-8.2,16.5,8.2,16.5);
mkLine(-4.5,0,4.5,0,0.07); mkLine(-4.5,0,-4.5,5.5); mkLine(4.5,0,4.5,5.5); mkLine(-4.5,5.5,4.5,5.5);
const spotM = new THREE.Mesh(new THREE.CircleGeometry(0.11,24), new THREE.MeshBasicMaterial({color:0xf4f1e8}));
spotM.rotation.x=-Math.PI/2; spotM.position.set(0,0.015,11); scene.add(spotM);

// Goal
const postMat = new THREE.MeshStandardMaterial({color:0xf4f1e8, roughness:0.3, metalness:0.45});
function post(w,h,d,x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),postMat); m.position.set(x,y,z); m.castShadow=true; scene.add(m); }
post(0.11,2.44,0.11,-3.66,1.22,0); post(0.11,2.44,0.11,3.66,1.22,0); post(7.44,0.11,0.11,0,2.44,0);
const netMat = new THREE.LineBasicMaterial({color:0xf4f1e8, transparent:true, opacity:0.25});
const netG = new THREE.Group();
for(let i=0;i<=14;i++){ const x=-3.66+i*(7.32/14); const pts=[new THREE.Vector3(x,0,0),new THREE.Vector3(x,2.44,0),new THREE.Vector3(x,2.44,-1.9),new THREE.Vector3(x,0,-1.9)]; netG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),netMat)); }
for(let i=0;i<=9;i++){ const y=i*(2.44/9); netG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-3.66,y,0),new THREE.Vector3(3.66,y,0)]),netMat)); }
scene.add(netG);

const zoneCenters = [];
for(let r=0;r<3;r++) for(let c=0;c<3;c++) zoneCenters.push(new THREE.Vector3(-2.4+c*2.4, 2.05-r*0.85, 0.12));

// Ball
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.11,36,28), new THREE.MeshStandardMaterial({color:0xf4f1e8, roughness:0.35, metalness:0.12}));
ball.castShadow = true; ball.position.set(0,0.11,11); scene.add(ball);
const ballLineMat = new THREE.LineBasicMaterial({color:0x222});
for(let i=0;i<6;i++){ const pts=new THREE.EllipseCurve(0,0,0.111,0.111,0,Math.PI*2).getPoints(36).map(p=>new THREE.Vector3(p.x,p.y,0)); const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),ballLineMat); ln.rotation.y=i*Math.PI/3; ball.add(ln); }
const strikeGlow = new THREE.Mesh(new THREE.SphereGeometry(0.028,16,12), new THREE.MeshBasicMaterial({color:0xf5c242, transparent:true, opacity:0}));
ball.add(strikeGlow);

// ========== DETAILED HUMANOID BUILDER ==========
function createHumanoid(opts){
  const g = new THREE.Group();
  const skin = opts.skin || 0xe8c4a0;
  const kit = opts.kit || 0x1e5c9c;
  const shortsC = opts.shorts || 0x1a4a80;
  const bootC = opts.boot || 0x1a1a1a;
  const isGK = !!opts.gk;

  const mat = (c,r=0.65,m=0.05) => new THREE.MeshStandardMaterial({color:c, roughness:r, metalness:m});

  // Torso
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.20, 0.48, 8, 16), mat(kit,0.55));
  torso.position.y = 1.18; torso.castShadow = true; g.add(torso);

  // Shoulders
  const shoulderL = new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10), mat(kit));
  shoulderL.position.set(-0.26,1.38,0); g.add(shoulderL);
  const shoulderR = shoulderL.clone(); shoulderR.position.x = 0.26; g.add(shoulderR);

  // Head + face
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.135,20,16), mat(skin,0.7));
  head.position.y = 1.68; head.castShadow = true; g.add(head);
  // eyes
  const eyeMat = new THREE.MeshBasicMaterial({color:0x222});
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.018,8,6), eyeMat); eyeL.position.set(-0.045,1.70,0.12); g.add(eyeL);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.045; g.add(eyeR);
  // hair
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.14,14,12), mat(opts.hair||0x2a1a0e,0.9));
  hair.position.set(0,1.74,-0.015); hair.scale.set(1.02,0.72,1.05); g.add(hair);

  // Arms (upper + lower)
  function arm(side){
    const s = side==='L' ? -1 : 1;
    const up = new THREE.Mesh(new THREE.CapsuleGeometry(0.05,0.26,6,10), mat(skin));
    up.position.set(s*0.30,1.22,0); up.rotation.z = s*0.22; up.castShadow=true; g.add(up);
    const low = new THREE.Mesh(new THREE.CapsuleGeometry(0.042,0.24,6,10), mat(skin));
    low.position.set(s*0.40,0.95,0.04); low.rotation.z = s*0.12; g.add(low);
    // hand / glove
    if(isGK){
      const glove = new THREE.Mesh(new THREE.SphereGeometry(0.075,12,10), mat(0xf5c242,0.45));
      glove.position.set(s*0.46,0.78,0.08); g.add(glove);
    } else {
      const hand = new THREE.Mesh(new THREE.SphereGeometry(0.04,10,8), mat(skin));
      hand.position.set(s*0.45,0.80,0.06); g.add(hand);
    }
    return {up, low};
  }
  const armL = arm('L');
  const armR = arm('R');

  // Hips / shorts
  const hips = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.20,0.26,14), mat(shortsC,0.7));
  hips.position.y = 0.88; g.add(hips);

  // Legs
  function leg(side){
    const s = side==='L' ? -1 : 1;
    const up = new THREE.Mesh(new THREE.CapsuleGeometry(0.065,0.34,6,12), mat(shortsC));
    up.position.set(s*0.11,0.68,0); up.castShadow=true; g.add(up);
    const low = new THREE.Mesh(new THREE.CapsuleGeometry(0.05,0.32,6,12), mat(skin));
    low.position.set(s*0.11,0.30,0); g.add(low);
    // detailed boot
    const boot = new THREE.Group();
    const sole = new THREE.Mesh(new THREE.BoxGeometry(0.11,0.045,0.28), mat(bootC,0.4,0.15));
    sole.position.set(0,0.025,0.03); boot.add(sole);
    const upper = new THREE.Mesh(new THREE.BoxGeometry(0.10,0.07,0.20), mat(bootC,0.45));
    upper.position.set(0,0.07,0.0); boot.add(upper);
    // studs
    for(let i=0;i<3;i++){
      const st = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.01,0.02,6), mat(0x333,0.3,0.4));
      st.position.set((i-1)*0.028,0.005,0.06); boot.add(st);
    }
    boot.position.set(s*0.11,0.0,0.02);
    boot.castShadow = true; g.add(boot);
    return {up, low, boot};
  }
  const legL = leg('L');
  const legR = leg('R');

  // GK jersey number / collar hint
  if(isGK){
    const collar = new THREE.Mesh(new THREE.TorusGeometry(0.13,0.025,8,16), mat(0x222));
    collar.position.y = 1.42; collar.rotation.x = Math.PI/2; g.add(collar);
  }

  g.userData = {armL, armR, legL, legR, torso, head};
  return g;
}

// Kicker (blue kit, dark hair)
const player = createHumanoid({kit:0x1e5c9c, shorts:0x1a4a80, hair:0x2a1a0e, boot:0x111});
player.position.set(0.55, 0, 12.55);
player.rotation.y = -0.38;
scene.add(player);

// Keeper (orange, gloves already built)
const keeper = createHumanoid({kit:0xe15a3e, shorts:0x222, hair:0x3a2a1a, boot:0x111, gk:true});
keeper.position.set(0, 0, 0.55);
scene.add(keeper);

// Trajectory
const trajMat = new THREE.LineBasicMaterial({color:0xf5c242, transparent:true, opacity:0});
const trajGeo = new THREE.BufferGeometry();
const trajLine = new THREE.Line(trajGeo, trajMat);
scene.add(trajLine);

// Contact labels (sprites)
function makeLabel(text, color=0xf5c242){
  const c = document.createElement('canvas');
  c.width=256; c.height=64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(10,30,21,0.85)';
  ctx.roundRect(0,0,256,64,10); ctx.fill();
  ctx.strokeStyle = '#'+color.toString(16).padStart(6,'0');
  ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#f4f1e8';
  ctx.font = 'bold 22px Inter, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
  const spr = new THREE.Sprite(mat);
  spr.scale.set(0.9, 0.22, 1);
  spr.visible = false;
  scene.add(spr);
  return spr;
}
const labelFoot = makeLabel('INSTEP / LACES');
const labelBall = makeLabel('CONTACT POINT');
const labelPlant = makeLabel('PLANT FOOT');

// ========== UI ==========
const gkSelect = document.getElementById('gkSelect');
gks.forEach(g=>{ const o=document.createElement('option'); o.value=g.id; o.textContent=`${g.name} (${g.team})`; gkSelect.appendChild(o); });
gkSelect.onchange = ()=>{ state.gk=gks.find(g=>g.id===gkSelect.value); renderGk(); updateZones(); updateProb(); };

function renderGk(){
  const g=state.gk;
  document.getElementById('gkCard').innerHTML = `<strong>${g.name}</strong> · ${g.team}<br>${g.saves} save${g.saves!==1?'s':''} from ${g.faced} · ${g.savePct}%<br><span style="font-size:11.5px">${g.note}</span>
  <div class="weak-mini">${g.weak.map((w,i)=>`<div class="${w>=0.65?'w':w<=0.42?'s':'n'}">${zones[i].l}</div>`).join('')}</div>`;
}
const zonePicker=document.getElementById('zonePicker');
zones.forEach((z,i)=>{ const b=document.createElement('button'); b.className='zone-btn'; b.textContent=z.l; b.onclick=()=>{if(animating)return; state.selected=i; updateZones(); updateProb();}; zonePicker.appendChild(b); });
function updateZones(){ [...zonePicker.children].forEach((b,i)=>{ b.classList.toggle('selected',i===state.selected); b.classList.toggle('weak',state.gk.weak[i]>=0.62); }); }

const powerEl=document.getElementById('power'), curveEl=document.getElementById('curve');
powerEl.oninput=()=>{ state.power=+powerEl.value; document.getElementById('powerVal').textContent=state.power; powerEl.style.setProperty('--fill',((state.power-25)/75*100)+'%'); updateProb(); };
curveEl.oninput=()=>{ state.curve=+curveEl.value; document.getElementById('curveVal').textContent=state.curve; curveEl.style.setProperty('--fill',((state.curve+45)/90*100)+'%'); updateProb(); };
powerEl.dispatchEvent(new Event('input')); curveEl.dispatchEvent(new Event('input'));
document.getElementById('weatherRow').onclick=e=>{ const b=e.target.closest('.chip'); if(!b)return; [...e.currentTarget.children].forEach(c=>c.classList.remove('active')); b.classList.add('active'); state.weather=b.dataset.w; updateProb(); };

function calcChance(){
  let base=50+(zones[state.selected].p/29)*38 + (state.gk.weak[state.selected]-0.5)*24;
  let pp=state.power>88?(state.power-88)*0.65:(state.power<32?(32-state.power)*0.4:0);
  return Math.max(7,Math.min(93,Math.round(base-pp-Math.abs(state.curve)*0.2-(state.weather==='clear'?0:state.weather==='wind'?7:10)-(state.gk.savePct/40)*8)));
}
function updateProb(){ document.getElementById('baseRate').textContent=zones[state.selected].p+'%'; document.getElementById('predChance').textContent=calcChance()+'%'; }

// ========== ANIMATION ==========
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function easeInOut(t){return t<.5?2*t*t:-1+(4-2*t)*t;}
function easeOut(t){return t*(2-t);}
function lerp(a,b,t){return a+(b-a)*t;}

const camWide={pos:new THREE.Vector3(0,3.4,15), target:new THREE.Vector3(0,1.3,2.5)};
const camFoot={pos:new THREE.Vector3(0.95,0.55,11.9), target:new THREE.Vector3(0.1,0.18,11.05)};
const camFollow={pos:new THREE.Vector3(0,2.9,9.2), target:new THREE.Vector3(0,1.5,1)};

async function animCam(from,to,dur){
  const t0=performance.now();
  return new Promise(res=>{
    (function f(now){
      const t=Math.min(1,(now-t0)/dur), e=easeInOut(t);
      camera.position.lerpVectors(from.pos,to.pos,e);
      controls.target.lerpVectors(from.target,to.target,e);
      controls.update();
      if(t<1) requestAnimationFrame(f); else res();
    })(t0);
  });
}

const banner=document.getElementById('banner');
const techBar=document.getElementById('techBar');
const techPhase=document.getElementById('techPhase');
const techDesc=document.getElementById('techDesc');
const shootBtn=document.getElementById('shootBtn');

function setTech(p,d){ techPhase.textContent=p; techDesc.textContent=d; techBar.classList.add('active'); }
function clearTech(){ techBar.classList.remove('active'); labelFoot.visible=labelBall.visible=labelPlant.visible=false; }

function updateTraj(idx,curve,power){
  const start=ball.position.clone(), end=zoneCenters[idx].clone();
  const mid=start.clone().lerp(end,0.5); mid.y+=1.25+(power-50)*0.012; mid.x+=curve*0.025;
  const pts=[]; for(let i=0;i<=42;i++){ const t=i/42; pts.push(new THREE.Vector3().copy(start).multiplyScalar((1-t)*(1-t)).add(mid.clone().multiplyScalar(2*(1-t)*t)).add(end.clone().multiplyScalar(t*t))); }
  trajGeo.setFromPoints(pts); trajMat.opacity=0.9;
}

async function shoot(){
  if(animating) return;
  animating=true; shootBtn.disabled=true; banner.classList.remove('show','goal','saved'); controls.enabled=false;

  const chance=calcChance(), success=Math.random()*100<chance;
  const targetZone=state.selected, targetPos=zoneCenters[targetZone].clone();
  const ud = player.userData;

  // --- 1. PLANT FOOT ---
  setTech('01 · PLANT THE NON-KICKING FOOT',
    'Plant foot lands 25–40 cm beside the ball. Toes point exactly at the target zone. This locks your hips and shoulders toward the aim.');
  await animCam({pos:camera.position.clone(),target:controls.target.clone()}, camFoot, 1500);

  // plant animation
  await new Promise(res=>{
    const t0=performance.now();
    (function f(now){
      const t=Math.min(1,(now-t0)/750), e=easeOut(t);
      ud.legL.up.rotation.x = -0.18*e;
      ud.legL.low.rotation.x = 0.28*e;
      ud.legL.boot.position.z = 0.02+0.07*e;
      if(t<1) requestAnimationFrame(f); else res();
    })(t0);
  });
  labelPlant.position.set(-0.25,0.35,11.35); labelPlant.visible=true;
  await wait(1100);

  // --- 2. STRIKE POINT + FOOT PART ---
  const contactType = Math.abs(state.curve)<12 ? 'INSTEP / LACES' : (state.curve>0 ? 'INSIDE OF FOOT' : 'INSIDE OF FOOT');
  setTech('02 · FOOT CONTACT + BALL STRIKE POINT',
    `Use the ${contactType.toLowerCase()} of the kicking foot. Strike ${Math.abs(state.curve)<12?'through the centre of the ball':'slightly off-centre'} for ${Math.abs(state.curve)<12?'pure power':'swerve'}. Ankle locked, knee over the ball at contact.`);

  // position markers
  const side = state.curve>12 ? -0.035 : state.curve<-12 ? 0.035 : 0;
  const hgt = state.power>80 ? 0.008 : -0.012;
  strikeGlow.position.set(side, hgt, 0.09);
  labelBall.position.copy(ball.position).add(new THREE.Vector3(side*2.2, 0.28, 0.15));
  labelFoot.position.set(0.35, 0.22, 11.25);

  await new Promise(res=>{
    const t0=performance.now();
    (function f(now){
      const t=Math.min(1,(now-t0)/650);
      strikeGlow.material.opacity = easeOut(t)*0.95;
      strikeGlow.scale.setScalar(0.75+0.45*Math.sin(t*Math.PI));
      labelBall.visible = labelFoot.visible = true;
      labelFoot.material.map.needsUpdate = true;
      // update foot label text
      if(t>0.1){ /* already set */ }
      if(t<1) requestAnimationFrame(f); else res();
    })(t0);
  });

  // slow-mo kicking leg swing
  await new Promise(res=>{
    const t0=performance.now();
    (function f(now){
      const t=Math.min(1,(now-t0)/1600);
      const swing = t<0.42 ? -1.25*(t/0.42) : -1.25 + 2.55*((t-0.42)/0.58);
      ud.legR.up.rotation.x = swing;
      ud.legR.low.rotation.x = Math.max(0, -swing*0.75);
      ud.armR.up.rotation.z = -0.22 - swing*0.18;
      // move boot toward ball at end
      if(t>0.55){
        const ft = (t-0.55)/0.45;
        ud.legR.boot.position.z = 0.02 + 0.12*easeOut(ft);
        ud.legR.boot.position.x = 0.11 - 0.08*easeOut(ft);
      }
      if(t<1) requestAnimationFrame(f); else res();
    })(t0);
  });
  await wait(500);

  // --- 3. TRAJECTORY ---
  setTech('03 · BALL PATH INTO THE NET',
    `Target zone: ${zones[targetZone].l}. Yellow line = predicted flight with power ${state.power} and curve ${state.curve}.`);
  labelPlant.visible = labelFoot.visible = labelBall.visible = false;
  updateTraj(targetZone, state.curve, state.power);
  await animCam({pos:camera.position.clone(),target:controls.target.clone()}, camFollow, 1000);
  await wait(1300);

  strikeGlow.material.opacity = 0;
  clearTech();

  // Actual flight
  const startPos = ball.position.clone();
  const endPos = targetPos.clone();
  const ctrl = startPos.clone().lerp(endPos,0.45);
  ctrl.y += 1.45+(state.power-50)*0.015; ctrl.x += state.curve*0.028;

  const diveSide = success ? (Math.random()>0.5?1:-1) : Math.sign(targetPos.x)||1;
  const kStart = keeper.position.clone();
  const kEnd = new THREE.Vector3(diveSide*2.15, 0.25, 0.35);
  const kud = keeper.userData;

  const dur = 1350, t0 = performance.now();
  await new Promise(resolve=>{
    (function frame(now){
      const t=Math.min(1,(now-t0)/dur), bt=easeInOut(t), omt=1-bt;
      ball.position.set(
        omt*omt*startPos.x + 2*omt*bt*ctrl.x + bt*bt*endPos.x,
        omt*omt*startPos.y + 2*omt*bt*ctrl.y + bt*bt*endPos.y,
        omt*omt*startPos.z + 2*omt*bt*ctrl.z + bt*bt*endPos.z
      );
      ball.rotation.x += 0.28; ball.rotation.y += 0.14;

      const kt=Math.max(0,Math.min(1,(t-0.1)/0.78)), ke=easeOut(kt);
      keeper.position.lerpVectors(kStart,kEnd,ke);
      keeper.rotation.z = -diveSide*ke*1.05;
      kud.torso.rotation.z = -diveSide*ke*0.25;
      kud.armL.up.rotation.z = -0.5*ke; kud.armR.up.rotation.z = 0.5*ke;

      camera.position.x = lerp(camFollow.pos.x, endPos.x*0.22, bt*0.55);
      controls.target.x = lerp(camFollow.target.x, endPos.x*0.35, bt*0.45);

      if(t<1) requestAnimationFrame(frame); else resolve();
    })(t0);
  });

  trajMat.opacity = 0;
  stats.att++; if(success) stats.goal++; else stats.save++;
  document.getElementById('sAtt').textContent=stats.att;
  document.getElementById('sGoal').textContent=stats.goal;
  document.getElementById('sSave').textContent=stats.save;
  document.getElementById('sRate').textContent=Math.round(stats.goal/stats.att*100)+'%';

  banner.textContent = success ? 'GOAL!' : 'SAVED!';
  banner.classList.add('show', success?'goal':'saved');
  await wait(1500);

  // reset
  ball.position.set(0,0.11,11); ball.rotation.set(0,0,0);
  keeper.position.copy(kStart); keeper.rotation.z=0;
  kud.torso.rotation.z=0; kud.armL.up.rotation.z=0.22; kud.armR.up.rotation.z=-0.22;
  ud.legL.up.rotation.x=0; ud.legL.low.rotation.x=0; ud.legL.boot.position.set(-0.11,0,0.02);
  ud.legR.up.rotation.x=0; ud.legR.low.rotation.x=0; ud.legR.boot.position.set(0.11,0,0.02);
  ud.armR.up.rotation.z=-0.22;

  await animCam({pos:camera.position.clone(),target:controls.target.clone()}, camWide, 850);
  controls.enabled=true; banner.classList.remove('show');
  animating=false; shootBtn.disabled=false;
}
shootBtn.onclick = shoot;

// loop
function resize(){ const w=viewport.clientWidth,h=viewport.clientHeight; camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h); }
window.addEventListener('resize',resize); resize();
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();

renderGk(); updateZones(); updateProb();
</script>
</body>
</html>
