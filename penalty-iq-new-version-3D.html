<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penalty IQ — 3D Technique Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-black:#0A1E15;
    --chalk:#F4F1E8;
    --chalk-dim:#B9C4BB;
    --floodlight:#F5C242;
    --rust:#E15A3E;
    --panel:rgba(10,30,21,0.82);
    --border:rgba(244,241,232,0.14);
    --accent:#3ECF8E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:#0A1E15;
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
  }
  .app{
    display:grid;
    grid-template-columns:1fr 340px;
    height:100vh;
  }
  @media(max-width:900px){
    .app{grid-template-columns:1fr; grid-template-rows:1fr auto;}
  }
  #viewport{
    position:relative;
    background:#0d2b1d;
    overflow:hidden;
  }
  #viewport canvas{display:block;width:100%;height:100%;}
  .hud{
    position:absolute;top:0;left:0;right:0;padding:14px 18px;
    display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;z-index:10;
  }
  .hud-left .title{
    font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.03em;
    text-shadow:0 2px 8px rgba(0,0,0,.6);
  }
  .hud-left .sub{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--floodlight);
    letter-spacing:.12em;text-transform:uppercase;margin-top:2px;
  }
  .result-banner{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);
    font-family:'Bebas Neue',sans-serif;font-size:clamp(42px,8vw,72px);
    letter-spacing:.04em;opacity:0;transition:opacity .3s,transform .3s;
    text-shadow:0 4px 20px rgba(0,0,0,.7);pointer-events:none;z-index:15;
  }
  .result-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .result-banner.goal{color:var(--floodlight);}
  .result-banner.saved{color:var(--rust);}

  .tech-bar{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(transparent,rgba(6,18,12,.92));
    padding:40px 20px 18px;pointer-events:none;z-index:12;
    opacity:0;transition:opacity .4s;
  }
  .tech-bar.active{opacity:1;}
  .tech-phase{
    font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--floodlight);
    letter-spacing:.03em;
  }
  .tech-desc{font-size:13px;color:var(--chalk);max-width:520px;line-height:1.45;margin-top:4px;}

  .sidebar{
    background:var(--panel);border-left:1px solid var(--border);
    padding:18px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;
  }
  .section-label{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--floodlight);margin-bottom:6px;
  }
  .gk-select,.chip-row{width:100%;}
  .gk-select{
    background:rgba(0,0,0,.35);border:1px solid var(--border);color:var(--chalk);
    font-size:13px;padding:9px 10px;border-radius:8px;cursor:pointer;
  }
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 10px;
    border-radius:999px;border:1px solid var(--border);background:transparent;
    color:var(--chalk-dim);cursor:pointer;transition:.15s;
  }
  .chip:hover{border-color:var(--chalk-dim);color:var(--chalk);}
  .chip.active{background:var(--floodlight);border-color:var(--floodlight);color:#241a02;font-weight:600;}

  .field label{
    display:flex;justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--chalk-dim);margin-bottom:5px;
  }
  .field label span.val{color:var(--floodlight);}
  input[type=range]{
    -webkit-appearance:none;width:100%;height:4px;border-radius:2px;
    background:linear-gradient(90deg,var(--floodlight) 0%,var(--floodlight) var(--fill,50%),rgba(244,241,232,.15) var(--fill,50%));
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--chalk);border:3px solid var(--floodlight);cursor:pointer;
  }

  .zone-picker{
    display:grid;grid-template-columns:repeat(3,1fr);gap:5px;
  }
  .zone-btn{
    aspect-ratio:1.5;border:1px solid var(--border);border-radius:6px;
    background:rgba(0,0,0,.25);color:var(--chalk-dim);font-family:'IBM Plex Mono',monospace;
    font-size:10px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;
  }
  .zone-btn:hover{border-color:rgba(244,241,232,.4);}
  .zone-btn.selected{border-color:var(--floodlight);background:rgba(245,194,66,.15);color:var(--floodlight);}
  .zone-btn.weak{border-color:rgba(62,207,142,.6);color:var(--accent);}

  .prob-box{
    background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:10px;padding:10px 12px;
  }
  .prob-box .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
  .prob-box .k{font-size:11px;color:var(--chalk-dim);font-family:'IBM Plex Mono',monospace;}
  .prob-box .v{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--floodlight);}

  .shoot-btn{
    font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em;
    background:var(--floodlight);color:#241a02;border:none;border-radius:10px;
    padding:13px;cursor:pointer;transition:filter .12s,transform .1s;width:100%;
  }
  .shoot-btn:hover{filter:brightness(1.08);}
  .shoot-btn:active{transform:scale(.98);}
  .shoot-btn:disabled{opacity:.45;cursor:not-allowed;}

  .stats-row{display:flex;gap:8px;}
  .stat{
    flex:1;text-align:center;background:rgba(0,0,0,.22);border:1px solid var(--border);
    border-radius:8px;padding:7px 3px;
  }
  .stat .n{font-family:'Bebas Neue',sans-serif;font-size:20px;}
  .stat .l{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.05em;}

  .gk-card{
    background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:10px;padding:12px;
    font-size:12.5px;line-height:1.45;color:var(--chalk-dim);
  }
  .gk-card strong{color:var(--chalk);font-weight:600;}
  .weak-mini{
    display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:8px;
  }
  .weak-mini div{
    height:22px;border-radius:4px;font-size:9px;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
  }
  .weak-mini .w{background:rgba(62,207,142,.25);color:var(--accent);}
  .weak-mini .n{background:rgba(244,241,232,.06);color:var(--chalk-dim);}
  .weak-mini .s{background:rgba(225,90,62,.22);color:var(--rust);}
</style>
</head>
<body>
<div class="app">
  <div id="viewport">
    <div class="hud">
      <div class="hud-left">
        <div class="title">PENALTY IQ</div>
        <div class="sub">3D Technique Lab · PL 2025-26</div>
      </div>
    </div>
    <div class="result-banner" id="banner"></div>
    <div class="tech-bar" id="techBar">
      <div class="tech-phase" id="techPhase">PLANT FOOT</div>
      <div class="tech-desc" id="techDesc">Place the non-kicking foot parallel to the target…</div>
    </div>
  </div>

  <aside class="sidebar">
    <div>
      <div class="section-label">Premier League Goalkeeper</div>
      <select class="gk-select" id="gkSelect"></select>
      <div class="gk-card" id="gkCard" style="margin-top:10px;"></div>
    </div>

    <div>
      <div class="section-label">Target Zone</div>
      <div class="zone-picker" id="zonePicker"></div>
    </div>

    <div class="field">
      <label>Power <span class="val" id="powerVal">72</span></label>
      <input type="range" id="power" min="25" max="100" value="72">
    </div>
    <div class="field">
      <label>Curve <span class="val" id="curveVal">0</span></label>
      <input type="range" id="curve" min="-45" max="45" value="0">
    </div>

    <div>
      <div class="section-label">Conditions</div>
      <div class="chip-row" id="weatherRow">
        <button class="chip active" data-w="clear">Clear</button>
        <button class="chip" data-w="wind">Windy</button>
        <button class="chip" data-w="rain">Rain</button>
      </div>
    </div>

    <div class="prob-box">
      <div class="row"><span class="k">Base zone rate</span><span class="v" id="baseRate">29%</span></div>
      <div class="row"><span class="k">vs this keeper</span><span class="v" id="predChance">—%</span></div>
    </div>

    <button class="shoot-btn" id="shootBtn">TAKE THE KICK · SLOW-MO</button>

    <div class="stats-row">
      <div class="stat"><div class="n" id="sAtt">0</div><div class="l">Shots</div></div>
      <div class="stat"><div class="n" id="sGoal">0</div><div class="l">Goals</div></div>
      <div class="stat"><div class="n" id="sSave">0</div><div class="l">Saved</div></div>
      <div class="stat"><div class="n" id="sRate">—</div><div class="l">Rate</div></div>
    </div>
  </aside>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Data ----------
const gks = [
  {id:'kelleher',name:'Caoimhín Kelleher',team:'Brentford',saves:3,faced:8,savePct:37.5,
   note:'Most PL saves this season. Strong low-right; weaker high-left.',
   weak:[0.85,0.55,0.40, 0.70,0.45,0.50, 0.75,0.60,0.35]},
  {id:'martinez',name:'Emiliano Martínez',team:'Aston Villa',saves:1,faced:1,savePct:100,
   note:'Elite timing & gamesmanship. Low near-post and high far-post historically tougher.',
   weak:[0.50,0.35,0.65, 0.55,0.40,0.70, 0.45,0.50,0.60]},
  {id:'donnarumma',name:'Gianluigi Donnarumma',team:'Man City',saves:1,faced:1,savePct:100,
   note:'Huge frame. Extreme low corners remain the classic vulnerability when he commits.',
   weak:[0.70,0.40,0.75, 0.55,0.30,0.55, 0.80,0.45,0.85]},
  {id:'pickford',name:'Jordan Pickford',team:'Everton',saves:1,faced:4,savePct:25,
   note:'Aggressive early dives. Can be beaten by late direction change or high central.',
   weak:[0.60,0.70,0.55, 0.50,0.65,0.45, 0.55,0.75,0.50]},
  {id:'henderson',name:'Dean Henderson',team:'Crystal Palace',saves:1,faced:6,savePct:16.7,
   note:'Solid base. Low-left historically more productive against him.',
   weak:[0.75,0.50,0.45, 0.65,0.40,0.55, 0.80,0.55,0.50]},
  {id:'verbruggen',name:'Bart Verbruggen',team:'Brighton',saves:1,faced:6,savePct:16.7,
   note:'Athletic recovery. Extreme high corners hardest for his frame.',
   weak:[0.65,0.55,0.70, 0.50,0.35,0.50, 0.60,0.45,0.75]},
  {id:'roefs',name:'Robin Roefs',team:'Sunderland',saves:1,faced:3,savePct:33.3,
   note:'Proactive. Low far-post & high near-post look relatively softer.',
   weak:[0.55,0.45,0.70, 0.60,0.40,0.65, 0.50,0.55,0.75]},
  {id:'sels',name:'Matz Sels',team:'Nott\'m Forest',saves:1,faced:5,savePct:20,
   note:'Good shot-stopping. Mid-height either side more productive this season.',
   weak:[0.50,0.65,0.55, 0.70,0.45,0.70, 0.55,0.60,0.50]},
  {id:'mamardashvili',name:'Giorgi Mamardashvili',team:'Liverpool',saves:1,faced:2,savePct:50,
   note:'Limited sample. Large frame; low corners still classic vulnerability.',
   weak:[0.70,0.45,0.75, 0.55,0.35,0.55, 0.80,0.50,0.80]}
];

const zones = [
  {p:7,l:'High L'},{p:4,l:'High C'},{p:5,l:'High R'},
  {p:7,l:'Mid L'},{p:6,l:'Mid C'},{p:9,l:'Mid R'},
  {p:29,l:'Low L'},{p:10,l:'Low C'},{p:23,l:'Low R'}
];

let state = {
  selected:6, power:72, curve:0, weather:'clear', gk:gks[0]
};
let stats = {att:0,goal:0,save:0};
let animating = false;

// ---------- Three.js setup ----------
const viewport = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d2b1d);
scene.fog = new THREE.Fog(0x0d2b1d, 25, 55);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(0, 3.2, 14.5);
camera.lookAt(0, 1.6, 0);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
viewport.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 4;
controls.maxDistance = 22;
controls.target.set(0, 1.4, 2);

// Lights
const hemi = new THREE.HemisphereLight(0xb8d4c8, 0x1a3a28, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d0, 1.35);
sun.position.set(8, 18, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 40;
sun.shadow.camera.left = -18;
sun.shadow.camera.right = 18;
sun.shadow.camera.top = 18;
sun.shadow.camera.bottom = -8;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aacc, 0.35);
fill.position.set(-6, 6, -4);
scene.add(fill);

// ---------- Pitch ----------
const pitchMat = new THREE.MeshStandardMaterial({color:0x1a5c38, roughness:0.92, metalness:0.05});
const pitch = new THREE.Mesh(new THREE.PlaneGeometry(40, 50), pitchMat);
pitch.rotation.x = -Math.PI/2;
pitch.receiveShadow = true;
scene.add(pitch);

// pitch markings
function line(x1,z1,x2,z2,w=0.08){
  const len = Math.hypot(x2-x1,z2-z1);
  const geo = new THREE.PlaneGeometry(len, w);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:0xf4f1e8}));
  m.rotation.x = -Math.PI/2;
  m.position.set((x1+x2)/2, 0.01, (z1+z2)/2);
  m.rotation.z = Math.atan2(z2-z1, x2-x1);
  scene.add(m);
}
line(-8.2, 0, 8.2, 0, 0.09);
line(-8.2, 0, -8.2, 16.5);
line(8.2, 0, 8.2, 16.5);
line(-8.2, 16.5, 8.2, 16.5);
line(-4.5, 0, 4.5, 0, 0.07);
line(-4.5, 0, -4.5, 5.5);
line(4.5, 0, 4.5, 5.5);
line(-4.5, 5.5, 4.5, 5.5);
const spot = new THREE.Mesh(new THREE.CircleGeometry(0.12, 24), new THREE.MeshBasicMaterial({color:0xf4f1e8}));
spot.rotation.x = -Math.PI/2;
spot.position.set(0, 0.015, 11);
scene.add(spot);
const arcGeo = new THREE.TorusGeometry(9.15, 0.06, 8, 48, Math.PI*0.7);
const arc = new THREE.Mesh(arcGeo, new THREE.MeshBasicMaterial({color:0xf4f1e8}));
arc.rotation.x = Math.PI/2;
arc.position.set(0, 0.02, 11);
arc.rotation.z = Math.PI*0.15;
scene.add(arc);

// ---------- Goal ----------
const postMat = new THREE.MeshStandardMaterial({color:0xf4f1e8, roughness:0.35, metalness:0.4});
function post(w,h,d,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), postMat);
  m.position.set(x,y,z);
  m.castShadow = true;
  scene.add(m);
  return m;
}
post(0.12, 2.44, 0.12, -3.66, 1.22, 0);
post(0.12, 2.44, 0.12,  3.66, 1.22, 0);
post(7.44, 0.12, 0.12, 0, 2.44, 0);
const netMat = new THREE.LineBasicMaterial({color:0xf4f1e8, transparent:true, opacity:0.28});
const netGroup = new THREE.Group();
for(let i=0;i<=12;i++){
  const x = -3.66 + i*(7.32/12);
  const pts = [new THREE.Vector3(x,0,0), new THREE.Vector3(x,2.44,0), new THREE.Vector3(x,2.44,-1.8), new THREE.Vector3(x,0,-1.8)];
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  netGroup.add(new THREE.Line(g, netMat));
}
for(let i=0;i<=8;i++){
  const y = i*(2.44/8);
  const pts = [new THREE.Vector3(-3.66,y,0), new THREE.Vector3(3.66,y,0)];
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  netGroup.add(new THREE.Line(g, netMat));
}
scene.add(netGroup);

// zone centers for aiming
const zoneCenters = [];
for(let r=0;r<3;r++){
  for(let c=0;c<3;c++){
    const x = -2.4 + c*2.4;
    const y = 2.05 - r*0.85;
    zoneCenters.push(new THREE.Vector3(x, y, 0.15));
  }
}

// ---------- Ball ----------
const ballGeo = new THREE.SphereGeometry(0.11, 32, 24);
const ballMat = new THREE.MeshStandardMaterial({color:0xf4f1e8, roughness:0.4, metalness:0.1});
const ball = new THREE.Mesh(ballGeo, ballMat);
ball.castShadow = true;
ball.position.set(0, 0.11, 11);
scene.add(ball);

const ballLineMat = new THREE.LineBasicMaterial({color:0x1a1a1a});
for(let i=0;i<6;i++){
  const curve = new THREE.EllipseCurve(0,0,0.111,0.111,0,Math.PI*2,false,0);
  const pts = curve.getPoints(32).map(p=>new THREE.Vector3(p.x,p.y,0));
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const lineObj = new THREE.Line(g, ballLineMat);
  lineObj.rotation.y = i * Math.PI/3;
  ball.add(lineObj);
}

// glowing strike contact marker
const strikeGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.035, 16, 12),
  new THREE.MeshBasicMaterial({color:0xf5c242, transparent:true, opacity:0})
);
ball.add(strikeGlow);

// ---------- Player (stylized footballer) ----------
const player = new THREE.Group();
scene.add(player);

function limb(radius, length, color){
  const g = new THREE.CapsuleGeometry(radius, length, 6, 12);
  const m = new THREE.MeshStandardMaterial({color, roughness:0.65, metalness:0.08});
  const mesh = new THREE.Mesh(g, m);
  mesh.castShadow = true;
  return mesh;
}

const torso = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.22, 0.42, 8, 16),
  new THREE.MeshStandardMaterial({color:0x1e5c9c, roughness:0.6})
);
torso.position.y = 1.15;
torso.castShadow = true;
player.add(torso);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.145, 20, 16),
  new THREE.MeshStandardMaterial({color:0xe8c4a0, roughness:0.7})
);
head.position.y = 1.62;
head.castShadow = true;
player.add(head);

const hair = new THREE.Mesh(
  new THREE.SphereGeometry(0.15, 16, 12),
  new THREE.MeshStandardMaterial({color:0x2a1a0e, roughness:0.9})
);
hair.position.set(0, 1.68, -0.02);
hair.scale.set(1, 0.7, 1.05);
player.add(hair);

const upperArmL = limb(0.055, 0.28, 0xe8c4a0);
upperArmL.position.set(-0.32, 1.28, 0);
upperArmL.rotation.z = 0.25;
player.add(upperArmL);
const lowerArmL = limb(0.045, 0.26, 0xe8c4a0);
lowerArmL.position.set(-0.42, 0.98, 0.05);
lowerArmL.rotation.z = 0.15;
player.add(lowerArmL);

const upperArmR = limb(0.055, 0.28, 0xe8c4a0);
upperArmR.position.set(0.32, 1.28, 0);
upperArmR.rotation.z = -0.25;
player.add(upperArmR);
const lowerArmR = limb(0.045, 0.26, 0xe8c4a0);
lowerArmR.position.set(0.42, 0.98, 0.05);
lowerArmR.rotation.z = -0.15;
player.add(lowerArmR);

const upperLegL = limb(0.07, 0.36, 0x1e5c9c);
upperLegL.position.set(-0.12, 0.72, 0);
player.add(upperLegL);
const lowerLegL = limb(0.055, 0.34, 0xe8c4a0);
lowerLegL.position.set(-0.12, 0.32, 0);
player.add(lowerLegL);
const bootL = new THREE.Mesh(
  new THREE.BoxGeometry(0.12, 0.08, 0.26),
  new THREE.MeshStandardMaterial({color:0x111111, roughness:0.4})
);
bootL.position.set(-0.12, 0.05, 0.04);
bootL.castShadow = true;
player.add(bootL);

const upperLegR = limb(0.07, 0.36, 0x1e5c9c);
upperLegR.position.set(0.12, 0.72, 0);
player.add(upperLegR);
const lowerLegR = limb(0.055, 0.34, 0xe8c4a0);
lowerLegR.position.set(0.12, 0.32, 0);
player.add(lowerLegR);
const bootR = new THREE.Mesh(
  new THREE.BoxGeometry(0.12, 0.08, 0.26),
  new THREE.MeshStandardMaterial({color:0x222222, roughness:0.35, metalness:0.15})
);
bootR.position.set(0.12, 0.05, 0.04);
bootR.castShadow = true;
player.add(bootR);

const shorts = new THREE.Mesh(
  new THREE.CylinderGeometry(0.24, 0.22, 0.28, 16),
  new THREE.MeshStandardMaterial({color:0x1a4a80, roughness:0.7})
);
shorts.position.y = 0.88;
player.add(shorts);

player.position.set(0.55, 0, 12.6);
player.rotation.y = -0.35;

// ---------- Keeper ----------
const keeper = new THREE.Group();
scene.add(keeper);
const kTorso = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.24, 0.5, 8, 16),
  new THREE.MeshStandardMaterial({color:0xe15a3e, roughness:0.55})
);
kTorso.position.y = 1.25;
kTorso.castShadow = true;
keeper.add(kTorso);
const kHead = new THREE.Mesh(
  new THREE.SphereGeometry(0.15, 18, 14),
  new THREE.MeshStandardMaterial({color:0xe8c4a0, roughness:0.7})
);
kHead.position.y = 1.75;
keeper.add(kHead);
const gloveMat = new THREE.MeshStandardMaterial({color:0xf5c242, roughness:0.5});
const gloveL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), gloveMat);
gloveL.position.set(-0.38, 1.15, 0.15);
keeper.add(gloveL);
const gloveR = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), gloveMat);
gloveR.position.set(0.38, 1.15, 0.15);
keeper.add(gloveR);
const kLegL = limb(0.07, 0.4, 0x222222);
kLegL.position.set(-0.12, 0.55, 0);
keeper.add(kLegL);
const kLegR = limb(0.07, 0.4, 0x222222);
kLegR.position.set(0.12, 0.55, 0);
keeper.add(kLegR);
keeper.position.set(0, 0, 0.6);

// ---------- Trajectory line ----------
const trajMat = new THREE.LineBasicMaterial({color:0xf5c242, transparent:true, opacity:0});
const trajGeo = new THREE.BufferGeometry();
const trajLine = new THREE.Line(trajGeo, trajMat);
scene.add(trajLine);

// ---------- UI ----------
const gkSelect = document.getElementById('gkSelect');
gks.forEach(g=>{
  const o = document.createElement('option');
  o.value = g.id;
  o.textContent = `${g.name} (${g.team})`;
  gkSelect.appendChild(o);
});
gkSelect.addEventListener('change', ()=>{
  state.gk = gks.find(g=>g.id===gkSelect.value);
  renderGkCard();
  updateZones();
  updateProb();
});

function renderGkCard(){
  const g = state.gk;
  const cells = g.weak.map((w,i)=>{
    const cls = w>=0.65?'w': w<=0.42?'s':'n';
    return `<div class="${cls}">${zones[i].l}</div>`;
  }).join('');
  document.getElementById('gkCard').innerHTML = `
    <strong>${g.name}</strong> · ${g.team}<br>
    ${g.saves} save${g.saves!==1?'s':''} from ${g.faced} · ${g.savePct}%<br>
    <span style="font-size:11.5px">${g.note}</span>
    <div class="weak-mini">${cells}</div>
  `;
}

const zonePicker = document.getElementById('zonePicker');
zones.forEach((z,i)=>{
  const b = document.createElement('button');
  b.className = 'zone-btn';
  b.textContent = z.l;
  b.dataset.i = i;
  b.addEventListener('click', ()=>{
    if(animating) return;
    state.selected = i;
    updateZones();
    updateProb();
  });
  zonePicker.appendChild(b);
});
function updateZones(){
  [...zonePicker.children].forEach((b,i)=>{
    b.classList.toggle('selected', i===state.selected);
    b.classList.toggle('weak', state.gk.weak[i]>=0.62);
  });
}

const powerEl = document.getElementById('power');
const curveEl = document.getElementById('curve');
powerEl.addEventListener('input', ()=>{
  state.power = +powerEl.value;
  document.getElementById('powerVal').textContent = state.power;
  powerEl.style.setProperty('--fill', ((state.power-25)/75*100)+'%');
  updateProb();
});
curveEl.addEventListener('input', ()=>{
  state.curve = +curveEl.value;
  document.getElementById('curveVal').textContent = state.curve;
  curveEl.style.setProperty('--fill', ((state.curve+45)/90*100)+'%');
  updateProb();
});
powerEl.dispatchEvent(new Event('input'));
curveEl.dispatchEvent(new Event('input'));

document.getElementById('weatherRow').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  [...e.currentTarget.children].forEach(c=>c.classList.remove('active'));
  b.classList.add('active');
  state.weather = b.dataset.w;
  updateProb();
});

function calcChance(){
  const z = zones[state.selected];
  let base = 50 + (z.p/29)*38;
  base += (state.gk.weak[state.selected]-0.5)*24;
  let powerPen = state.power>88?(state.power-88)*0.65:(state.power<32?(32-state.power)*0.4:0);
  let curvePen = Math.abs(state.curve)*0.2;
  let weatherPen = state.weather==='clear'?0:state.weather==='wind'?7:10;
  let keeperPen = (state.gk.savePct/40)*8;
  return Math.max(7, Math.min(93, Math.round(base - powerPen - curvePen - weatherPen - keeperPen)));
}
function updateProb(){
  document.getElementById('baseRate').textContent = zones[state.selected].p+'%';
  document.getElementById('predChance').textContent = calcChance()+'%';
}

// ---------- Helpers ----------
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function easeInOut(t){return t<.5?2*t*t:-1+(4-2*t)*t;}
function easeOut(t){return t*(2-t);}
function lerp(a,b,t){return a+(b-a)*t;}

const camWide = {pos:new THREE.Vector3(0,3.2,14.5), target:new THREE.Vector3(0,1.4,2)};
const camFoot = {pos:new THREE.Vector3(1.1,0.85,12.1), target:new THREE.Vector3(0.15,0.25,11.1)};
const camFollow = {pos:new THREE.Vector3(0,2.8,9), target:new THREE.Vector3(0,1.5,1)};

async function animateCamera(from, to, duration){
  const t0 = performance.now();
  return new Promise(resolve=>{
    function frame(now){
      const t = Math.min(1,(now-t0)/duration);
      const e = easeInOut(t);
      camera.position.lerpVectors(from.pos, to.pos, e);
      controls.target.lerpVectors(from.target, to.target, e);
      controls.update();
      if(t<1) requestAnimationFrame(frame);
      else resolve();
    }
    requestAnimationFrame(frame);
  });
}

// ---------- Shoot sequence ----------
const banner = document.getElementById('banner');
const techBar = document.getElementById('techBar');
const techPhase = document.getElementById('techPhase');
const techDesc = document.getElementById('techDesc');
const shootBtn = document.getElementById('shootBtn');

function setTech(phase, desc){
  techPhase.textContent = phase;
  techDesc.textContent = desc;
  techBar.classList.add('active');
}
function clearTech(){ techBar.classList.remove('active'); }

function updateTraj(targetIdx, curve, power){
  const start = ball.position.clone();
  const end = zoneCenters[targetIdx].clone();
  const mid = start.clone().lerp(end, 0.5);
  mid.y += 1.2 + (power-50)*0.012;
  mid.x += curve * 0.025;
  const pts = [];
  for(let i=0;i<=40;i++){
    const t=i/40;
    const p = new THREE.Vector3().copy(start).multiplyScalar((1-t)*(1-t))
      .add(mid.clone().multiplyScalar(2*(1-t)*t))
      .add(end.clone().multiplyScalar(t*t));
    pts.push(p);
  }
  trajGeo.setFromPoints(pts);
  trajMat.opacity = 0.85;
}

async function shoot(){
  if(animating) return;
  animating = true;
  shootBtn.disabled = true;
  banner.classList.remove('show','goal','saved');
  controls.enabled = false;

  const chance = calcChance();
  const success = Math.random()*100 < chance;
  const targetZone = state.selected;
  const targetPos = zoneCenters[targetZone].clone();

  // Phase 1 – zoom to foot + plant
  setTech('01 · PLANT THE NON-KICKING FOOT',
    'Left foot lands 25–40 cm beside the ball, toes pointing exactly at the target. This locks hips and body alignment.');
  await animateCamera(
    {pos:camera.position.clone(), target:controls.target.clone()},
    camFoot, 1600
  );

  const plantStart = upperLegL.rotation.x;
  await new Promise(res=>{
    const t0=performance.now();
    function f(now){
      const t=Math.min(1,(now-t0)/700);
      upperLegL.rotation.x = plantStart - 0.15*easeOut(t);
      lowerLegL.rotation.x = 0.25*easeOut(t);
      bootL.position.z = 0.04 + 0.06*easeOut(t);
      if(t<1) requestAnimationFrame(f); else res();
    }
    requestAnimationFrame(f);
  });
  await wait(900);

  // Phase 2 – strike point highlight
  setTech('02 · STRIKE POINT ON THE BALL',
    state.curve===0
      ? 'Strike through the exact centre of the ball with a locked ankle. Knee over the ball at contact for pure power and low trajectory.'
      : `Strike slightly ${state.curve>0?'inside-right':'inside-left'} of centre to generate swerve. More curve reduces pure power.`);

  const side = state.curve>10 ? -0.04 : state.curve<-10 ? 0.04 : 0;
  const height = state.power>80 ? 0.01 : -0.015;
  strikeGlow.position.set(side, height, 0.09);
  await new Promise(res=>{
    const t0=performance.now();
    function f(now){
      const t=Math.min(1,(now-t0)/600);
      strikeGlow.material.opacity = easeOut(t)*0.95;
      strikeGlow.scale.setScalar(0.8+0.4*Math.sin(t*Math.PI));
      if(t<1) requestAnimationFrame(f); else res();
    }
    requestAnimationFrame(f);
  });

  // slow-mo swinging leg
  await new Promise(res=>{
    const t0=performance.now();
    function f(now){
      const t=Math.min(1,(now-t0)/1400);
      const swing = t<0.45 ? -1.1*(t/0.45) : -1.1 + 2.4*((t-0.45)/0.55);
      upperLegR.rotation.x = swing;
      lowerLegR.rotation.x = Math.max(0, -swing*0.7);
      upperArmR.rotation.z = -0.25 - swing*0.15;
      if(t<1) requestAnimationFrame(f); else res();
    }
    requestAnimationFrame(f);
  });
  await wait(400);

  // Phase 3 – trajectory into net
  setTech('03 · BALL PATH INTO THE NET',
    `Target: ${zones[targetZone].l}. Yellow line shows expected flight with current power (${state.power}) and curve (${state.curve}).`);
  updateTraj(targetZone, state.curve, state.power);
  await animateCamera(
    {pos:camera.position.clone(), target:controls.target.clone()},
    camFollow, 1100
  );
  await wait(1400);

  strikeGlow.material.opacity = 0;
  clearTech();

  // Actual shot (slowed)
  const startPos = ball.position.clone();
  const endPos = targetPos.clone();
  const ctrl = startPos.clone().lerp(endPos, 0.45);
  ctrl.y += 1.4 + (state.power-50)*0.015;
  ctrl.x += state.curve * 0.028;

  const diveSide = success ? (Math.random()>0.5?1:-1) : Math.sign(targetPos.x)||1;
  const kStart = keeper.position.clone();
  const kEnd = new THREE.Vector3(diveSide*2.1, 0.3, 0.4);

  const duration = 1300;
  const t0 = performance.now();
  await new Promise(resolve=>{
    function frame(now){
      const t = Math.min(1, (now-t0)/duration);
      const bt = easeInOut(t);
      const omt = 1-bt;
      ball.position.set(
        omt*omt*startPos.x + 2*omt*bt*ctrl.x + bt*bt*endPos.x,
        omt*omt*startPos.y + 2*omt*bt*ctrl.y + bt*bt*endPos.y,
        omt*omt*startPos.z + 2*omt*bt*ctrl.z + bt*bt*endPos.z
      );
      ball.rotation.x += 0.25;
      ball.rotation.y += 0.12;

      const kt = Math.max(0, Math.min(1, (t-0.12)/0.75));
      const ke = easeOut(kt);
      keeper.position.lerpVectors(kStart, kEnd, ke);
      keeper.rotation.z = -diveSide * ke * 0.9;
      kTorso.rotation.z = -diveSide * ke * 0.3;

      camera.position.x = lerp(camFollow.pos.x, endPos.x*0.25, bt*0.6);
      controls.target.x = lerp(camFollow.target.x, endPos.x*0.4, bt*0.5);

      if(t<1) requestAnimationFrame(frame);
      else resolve();
    }
    requestAnimationFrame(frame);
  });

  trajMat.opacity = 0;
  stats.att++;
  if(success) stats.goal++; else stats.save++;
  document.getElementById('sAtt').textContent = stats.att;
  document.getElementById('sGoal').textContent = stats.goal;
  document.getElementById('sSave').textContent = stats.save;
  document.getElementById('sRate').textContent = Math.round(stats.goal/stats.att*100)+'%';

  banner.textContent = success ? 'GOAL!' : 'SAVED!';
  banner.classList.add('show', success?'goal':'saved');

  await wait(1600);

  // reset
  ball.position.set(0, 0.11, 11);
  ball.rotation.set(0,0,0);
  keeper.position.copy(kStart);
  keeper.rotation.z = 0;
  kTorso.rotation.z = 0;
  upperLegL.rotation.x = 0;
  lowerLegL.rotation.x = 0;
  bootL.position.z = 0.04;
  upperLegR.rotation.x = 0;
  lowerLegR.rotation.x = 0;
  upperArmR.rotation.z = -0.25;

  await animateCamera(
    {pos:camera.position.clone(), target:controls.target.clone()},
    camWide, 900
  );
  controls.enabled = true;
  banner.classList.remove('show');
  animating = false;
  shootBtn.disabled = false;
}

shootBtn.addEventListener('click', shoot);

// ---------- Resize & loop ----------
function resize(){
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

function loop(){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}
loop();

// init
renderGkCard();
updateZones();
updateProb();
</script>
</body>
</html>
